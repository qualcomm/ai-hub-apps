# cpplint configuration for AI Hub Apps C++ sources.
# cpplint reads this file automatically for files in this directory tree.
# Line length is kept in sync with .clang-format (ColumnLimit: 120).
set noparent
linelength=120

# Disabled filters:
#   whitespace/*            -> owned by clang-format
#   build/include_subdir    -> app dirs are flat; headers sit beside sources
#   build/include_what_you_use -> heuristic, unreliable without compilation
#   build/c++11, build/c++17 -> Google-internal header allowlist; the repo
#                               targets C++17 and uses <filesystem> etc.
#   legal/copyright         -> license headers handled by the pre-commit
#                               insert-license hook
filter=-whitespace,-build/include_subdir,-build/include_what_you_use,-build/c++11,-build/c++17,-legal/copyright
