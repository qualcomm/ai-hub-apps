name: Face Recognition
id: face_recognition_ubuntu_py
license_url: https://github.com/qualcomm/ai-hub-apps/blob/main/LICENSE
license_type: bsd-3-clause
runtime: tflite
status: published
domain: 'Computer Vision'
headline: 'On-device live face recognition with TFLite'
description: 'A sample app for Ubuntu that performs on-device face recognition with any face-embedding model via TFLite Runtime (CavaFace is the default supported model). Identities are enrolled from a directory of face images; a live camera stream is then processed frame-by-frame to detect faces, embed each one on-device, and draw a labeled bounding box naming the matched person (or "Unknown"). It leverages GStreamer for camera input and a minimal web interface to stream the annotated frames, suitable for embedded applications.'
precisions: [float]
app_type: 'ubuntu'
static_img_filename: 'CavaFace.png'
app_repo_relative_path: 'face_recognition_ubuntu_py'
model_file_paths:
  - 'models/cavaface.tflite'
os:
  name: Ubuntu
  version: 24.04+
languages: ['Python']
base_docker: ubuntu.dockerfile
use_case: 'Face Recognition'
supported_devices:
  - name: "Arduino VENTUNO Q"
    status: "Tested"
  - name: "Dragonwing IQ-9075 EVK"
    status: "Not Tested"
related_models: ['cavaface']
