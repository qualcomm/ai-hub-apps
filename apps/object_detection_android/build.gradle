plugins {
    id 'com.android.application' version '8.13.0'
}

// Load shared versions and utilities — must be before android {} and dependencies {}
if (file('_shared/android/common.gradle').exists()) {
    apply from: '_shared/android/common.gradle'
}

android {
    ndkVersion ANDROID_NDK_VERSION
    compileSdk ANDROID_COMPILE_API

    defaultConfig {
        applicationId "com.quicinc.objectdetection"
        minSdk ANDROID_MIN_API
        targetSdk ANDROID_TARGET_API
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue( "string", "tfLiteModelAsset", "detector.tflite")
        resValue( "string", "tfLiteLabelsAsset", "labels.txt")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    preBuild.doFirst {
        if (!file("./src/main/assets/detector.tflite").exists()) {
            throw new RuntimeException("detector.tflite is missing. Please refer to the app README for instructions on how to compile and place the model.")
        }

        if (!file("./src/main/assets/labels.txt").exists()) {
            throw new RuntimeException("labels.txt is missing. Please refer to the app README for instructions on how to compile and place the labels.")
        }

    }

    namespace 'com.quicinc.objectdetection'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    api "org.tensorflow:tensorflow-lite:${TF_LITE_VERSION}"
    implementation "org.tensorflow:tensorflow-lite-gpu:${TF_LITE_VERSION}"
    implementation "org.tensorflow:tensorflow-lite-gpu-api:${TF_LITE_VERSION}"
    implementation 'org.tensorflow:tensorflow-lite-gpu-delegate-plugin:0.4.4'
    implementation 'org.opencv:opencv:4.10.0'
    implementation "com.qualcomm.qti:qnn-runtime:${QNN_VERSION}"
    implementation "com.qualcomm.qti:qnn-litert-delegate:${QNN_VERSION}"
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
