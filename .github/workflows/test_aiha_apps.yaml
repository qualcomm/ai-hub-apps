##
## Test AIHA Apps — fetch, build, and on-device QDC testing via the CLI.
##

name: Test AIHA Apps

on:
  workflow_call:
    inputs:
      model_selection:
        description: "Which models to test per app (first/random/all)"
        type: string
        default: first
      test_stage:
        description: "How far to run: fetch, build, or all (includes on-device QDC)"
        type: string
        default: all
      app_filter:
        description: "Comma-separated app IDs to test, e.g. chatapp_android,image_classification_android. Empty = all registered apps."
        type: string
        required: false
        default: ""
    secrets:
      QDC_API_TOKEN:
        required: false
      DOCKER_QC_REGISTRY_TOKEN:
        required: false
      HUB_USER_TOKEN_PROD:
        required: false
    outputs:
      result_payload:
        description: "JSON with summary counts and per-app results"
        value: ${{ jobs.report.outputs.result_payload }}

  workflow_dispatch:
    inputs:
      model_selection:
        description: "Which models to test per app"
        required: false
        type: choice
        options: [first, random, all]
        default: first
      test_stage:
        description: "How far to run: fetch, build, or all (on-device)"
        required: false
        type: choice
        options: [fetch, build, all]
        default: all
      app_filter:
        description: "Comma-separated app IDs to test, e.g. chatapp_android,image_classification_android. Empty = all registered apps."
        required: false
        type: string
        default: ""

env:
  VENV_PATH: qaiha-dev
  PYTHON_VERSION: '3.10'
  PYTHONUNBUFFERED: 1
  QDC_TOKEN: ${{ secrets.QDC_API_TOKEN }}
  QDC_JOB_LIMIT: ${{ vars.QDC_JOB_LIMIT }}

jobs:
  list_apps:
    name: "Distribute Apps by Type"
    runs-on: [tetra-ubuntu-2204, self-hosted]
    outputs:
      ubuntu: ${{ steps.list.outputs.ubuntu }}
      android: ${{ steps.list.outputs.android }}
      windows: ${{ steps.list.outputs.windows }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up environment (with CLI)
        run: |
          bash tools/setup_env.sh \
            --python="${{ steps.setup_python.outputs.python-path }}" \
            --venv="${{ env.VENV_PATH }}" \
            --with-cli

      - name: Generate test registry (test scope)
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          python -m qai_hub_apps_test.scripts.generate_registry \
            --output_dir cli/qai_hub_apps/ --scope test

      - id: list
        name: Group apps by type and verify coverage
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          if [ -n "${{ inputs.app_filter }}" ]; then
            python tools/ci/list_and_verify_apps.py --only '${{ inputs.app_filter }}' >> $GITHUB_OUTPUT
          else
            python tools/ci/list_and_verify_apps.py >> $GITHUB_OUTPUT
          fi


  test_ubuntu_apps:
    name: "Test ${{ matrix.app }} (ubuntu)"
    needs: list_apps
    if: ${{ needs.list_apps.outputs.ubuntu != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: ${{ fromJson(needs.list_apps.outputs.ubuntu) }}
    uses: ./.github/workflows/test-app.yaml
    with:
      app: ${{ matrix.app }}
      app_type: ubuntu
      model_selection: ${{ inputs.model_selection }}
      test_stage: ${{ inputs.test_stage }}
    secrets:
      QDC_API_TOKEN: ${{ secrets.QDC_API_TOKEN }}
      DOCKER_QC_REGISTRY_TOKEN: ${{ secrets.DOCKER_QC_REGISTRY_TOKEN }}


  test_android_apps:
    name: "Test ${{ matrix.app }} (android)"
    needs: list_apps
    if: ${{ needs.list_apps.outputs.android != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: ${{ fromJson(needs.list_apps.outputs.android) }}
    uses: ./.github/workflows/test-app.yaml
    with:
      app: ${{ matrix.app }}
      app_type: android
      model_selection: ${{ inputs.model_selection }}
      test_stage: ${{ inputs.test_stage }}
    secrets:
      QDC_API_TOKEN: ${{ secrets.QDC_API_TOKEN }}
      DOCKER_QC_REGISTRY_TOKEN: ${{ secrets.DOCKER_QC_REGISTRY_TOKEN }}


  test_windows_apps:
    name: "Test ${{ matrix.app }} (windows)"
    needs: list_apps
    if: ${{ needs.list_apps.outputs.windows != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: ${{ fromJson(needs.list_apps.outputs.windows) }}
    uses: ./.github/workflows/test-app.yaml
    with:
      app: ${{ matrix.app }}
      app_type: windows
      model_selection: ${{ inputs.model_selection }}
      test_stage: ${{ inputs.test_stage }}
    secrets:
      QDC_API_TOKEN: ${{ secrets.QDC_API_TOKEN }}
      DOCKER_QC_REGISTRY_TOKEN: ${{ secrets.DOCKER_QC_REGISTRY_TOKEN }}
      HUB_USER_TOKEN_PROD: ${{ secrets.HUB_USER_TOKEN_PROD }}


  report:
    name: "Build Test Report"
    needs: [test_ubuntu_apps, test_android_apps, test_windows_apps]
    if: always()
    runs-on: [tetra-ubuntu-2204, self-hosted]
    outputs:
      result_payload: ${{ steps.build.outputs.result_payload }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          merge-multiple: true
          path: results/

      - id: build
        name: Build report
        run: |
          python tools/ci/build_test_report.py results/ --output-type markdown >> $GITHUB_STEP_SUMMARY
          payload=$(python tools/ci/build_test_report.py results/ --output-type json)
          echo "result_payload=$payload" >> $GITHUB_OUTPUT
