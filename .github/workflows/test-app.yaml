##
## Test a single AIHA app — fetch, build, and on-device QDC testing via the CLI.
##

name: Test App

on:
  workflow_call:
    inputs:
      app:
        description: "App ID to test"
        type: string
        required: true
      app_type:
        description: "App platform: ubuntu, android, or windows"
        type: string
        required: true
      model_selection:
        description: "Which models to test per app (first/random/all)"
        type: string
        default: first
      test_stage:
        description: "How far to run: fetch, build, or all (includes on-device QDC)"
        type: string
        default: all
      use_docker:
        description: "Build and run inside Docker (true) or natively (false)."
        type: boolean
        required: false
        default: true
      version:
        description: "qai-hub-apps version to install (required unless install_source=source)."
        type: string
        required: false
        default: ""
      install_source:
        description: "Where to install the CLI from: source (editable), s3 (dev index), or prod (PyPI)."
        type: string
        required: false
        default: source
    secrets:
      QDC_API_TOKEN:
        required: false
      DOCKER_QC_REGISTRY_TOKEN:
        required: false
      HUB_USER_TOKEN_PROD:
        required: false
      QAIHA_CI_AWS_ROLE_ARN:
        required: false

  workflow_dispatch:
    inputs:
      app:
        description: "App ID to test"
        required: true
        type: string
      app_type:
        description: "App platform: ubuntu, android, or windows"
        required: true
        type: choice
        options: [ubuntu, android, windows]
        default: ubuntu
      model_selection:
        description: "Which models to test per app"
        required: false
        type: choice
        options: [first, random, all]
        default: first
      test_stage:
        description: "How far to run: fetch, build, or all (on-device)"
        required: false
        type: choice
        options: [fetch, build, all]
        default: all
      use_docker:
        description: "Build and run inside Docker (true) or natively (false)."
        required: false
        type: boolean
        default: true
      version:
        description: "qai-hub-apps version to install (required unless install_source=source)."
        required: false
        type: string
        default: ""
      install_source:
        description: "Where to install the CLI from."
        required: false
        type: choice
        options: [source, s3, prod]
        default: source

env:
  VENV_PATH: qaiha-dev
  ACTIVATE_VENV: ${{ inputs.app_type == 'windows' && '. qaiha-dev\Scripts\Activate.ps1' || 'source qaiha-dev/bin/activate' }}
  PYTHON_VERSION: '3.10'
  PYTHONUNBUFFERED: 1
  PYTHONUTF8: '1'
  PYTEST_DEBUG_TEMPROOT: ${{ inputs.app_type == 'windows' && 'C:\t' || '' }}
  QDC_TOKEN: ${{ secrets.QDC_API_TOKEN }}
  QDC_JOB_LIMIT: ${{ vars.QDC_JOB_LIMIT }}
  # Runners are on the Qualcomm internal network, so generated build.sh scripts
  # build against the internal registry mirror and install the Qualcomm CA.
  QC_INTERNAL_HOST: '1'
  # Capture full CLI diagnostics (fetch/build) in CI logs.
  QAI_HUB_APPS_LOG_LEVEL: debug

jobs:
  test:
    name: "Test ${{ inputs.app }}"
    runs-on: ${{ inputs.app_type == 'windows' && fromJSON('["self-hosted", "Windows", "X64", "windows-docker"]') || fromJSON('["tetra-ubuntu-2204", "self-hosted"]') }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup AWS Credentials
        uses: ./.github/actions/configure-multiple-aws-roles
        with:
          role-to-assume: ${{ secrets.QAIHA_CI_AWS_ROLE_ARN }}
          role-duration-seconds: 7200
          profile: qaihm
          aws-region: us-west-2

      # install_source=source installs the CLI editable from the checked-out repo
      # (--with-cli). Otherwise the CLI is installed from a published version below.
      - name: Set up environment (Linux)
        if: ${{ inputs.app_type != 'windows' }}
        run: |
          bash tools/setup_env.sh \
            --python="${{ steps.setup_python.outputs.python-path }}" \
            --venv="${{ env.VENV_PATH }}" \
            ${{ inputs.install_source == 'source' && '--with-cli' || '' }} \
            --with-qdc-sdk

      - name: Set up environment (Windows)
        if: ${{ inputs.app_type == 'windows' }}
        run: |
          . tools/setup_env.ps1 `
            -Python "${{ steps.setup_python.outputs.python-path }}" `
            -Venv "${{ env.VENV_PATH }}" `
            ${{ inputs.install_source == 'source' && '-WithCli' || '' }} `
            -WithQdcSdk

      - name: Install CLI from published version (Linux)
        if: ${{ inputs.install_source != 'source' && inputs.app_type != 'windows' }}
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ inputs.install_source }}
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          bash tools/ci/install_cli.sh --source "$SOURCE" --version "$VERSION"

      - name: Install CLI from published version (Windows)
        if: ${{ inputs.install_source != 'source' && inputs.app_type == 'windows' }}
        env:
          VERSION: ${{ inputs.version }}
          SOURCE: ${{ inputs.install_source }}
        run: |
          . qaiha-dev\Scripts\Activate.ps1
          . tools/ci/install_cli.ps1 -Source "$env:SOURCE" -Version "$env:VERSION"

      # Only needed when the CLI is installed editable from source; a published
      # (non-editable) client fetches the versioned registry from S3 instead.
      - name: Generate test registry (test scope)
        if: ${{ inputs.install_source == 'source' }}
        run: |
          ${{ env.ACTIVATE_VENV }}
          python -m qai_hub_apps_test.scripts.generate_registry --output_dir cli/qai_hub_apps/ --scope test

      - name: Configure QAI Hub client
        if: ${{ inputs.app_type == 'windows' }}
        run: |
          ${{ env.ACTIVATE_VENV }}
          qai-hub configure --api_token ${{ secrets.HUB_USER_TOKEN_PROD }}

      - name: Log in to Qualcomm Docker registry
        if: ${{ inputs.test_stage != 'fetch'  && inputs.app_type != 'windows'}}
        uses: ./.github/actions/docker-login-qc-registry
        with:
          token: ${{ secrets.DOCKER_QC_REGISTRY_TOKEN }}

      - name: Create short build root (Windows)
        if: ${{ inputs.app_type == 'windows' }}
        run: New-Item -ItemType Directory -Path 'C:\t' -Force | Out-Null

      - name: Run tests for ${{ inputs.app }}
        run: |
          ${{ env.ACTIVATE_VENV }}
          cd tools/python/qai_hub_apps_test/
          python -m pytest -vv -ra -s -m device_test --model-selection "${{ inputs.model_selection }}" --test-stage "${{ inputs.test_stage }}" ${{ inputs.use_docker == false && '--no-docker' || '' }} --qdc-token "${{ env.QDC_TOKEN }}" --cli-version "${{ inputs.version }}" --cli-source "${{ inputs.install_source }}" --json-report --json-report-file="${{ inputs.app }}-results.json" -k "${{ inputs.app }}"

      - name: Ensure json-report-file (Linux)
        if: ${{ always() && inputs.app_type != 'windows' }}
        run: |
          RESULTS_FILE="tools/python/qai_hub_apps_test/${{ inputs.app }}-results.json"
          if [ ! -f "$RESULTS_FILE" ]; then
            echo '{"tests":[
              {"nodeid":"test_1_fetch_app[${{ inputs.app }}-setup_failed]","outcome":"failed"},
              {"nodeid":"test_2_build_app[${{ inputs.app }}-setup_failed]","outcome":"failed"},
              {"nodeid":"test_3_on_device_app[${{ inputs.app }}-setup_failed]","outcome":"failed"}
            ]}' > "$RESULTS_FILE"
          fi

      - name: Ensure json-report-file (Windows)
        if: ${{ always() && inputs.app_type == 'windows' }}
        run: |
          $resultsFile = "tools\python\qai_hub_apps_test\${{ inputs.app }}-results.json"
          if (-not (Test-Path $resultsFile)) {
            @'
          {"tests":[
            {"nodeid":"test_1_fetch_app[${{ inputs.app }}-setup_failed]","outcome":"failed"},
            {"nodeid":"test_2_build_app[${{ inputs.app }}-setup_failed]","outcome":"failed"},
            {"nodeid":"test_3_on_device_app[${{ inputs.app }}-setup_failed]","outcome":"failed"}
          ]}
          '@ | Set-Content -Path $resultsFile -Encoding utf8
          }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ inputs.app }}
          path: tools/python/qai_hub_apps_test/${{ inputs.app }}-results.json
