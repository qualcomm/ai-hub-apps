##
## Test a single AIHA app — fetch, build, and on-device QDC testing via the CLI.
##

name: Test App

on:
  workflow_call:
    inputs:
      app:
        description: "App ID to test"
        type: string
        required: true
      model_selection:
        description: "Which models to test per app (first/random/all)"
        type: string
        default: first
      test_stage:
        description: "How far to run: fetch, build, or all (includes on-device QDC)"
        type: string
        default: all
    secrets:
      QDC_API_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      app:
        description: "App ID to test"
        required: true
        type: string
      model_selection:
        description: "Which models to test per app"
        required: false
        type: choice
        options: [first, random, all]
        default: first
      test_stage:
        description: "How far to run: fetch, build, or all (on-device)"
        required: false
        type: choice
        options: [fetch, build, all]
        default: all

env:
  VENV_PATH: qaiha-dev
  PYTHON_VERSION: '3.10'
  PYTHONUNBUFFERED: 1
  QDC_TOKEN: ${{ secrets.QDC_API_TOKEN }}
  QDC_JOB_LIMIT: ${{ vars.QDC_JOB_LIMIT }}

jobs:
  test:
    name: "Test ${{ inputs.app }}"
    runs-on: [tetra-ubuntu-2204, self-hosted]

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up environment (with CLI + QDC SDK)
        run: |
          bash tools/setup_env.sh \
            --python="${{ steps.setup_python.outputs.python-path }}" \
            --venv="${{ env.VENV_PATH }}" \
            --with-cli \
            --with-qdc-sdk

      - name: Run tests for ${{ inputs.app }}
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          cd tools/python/qai_hub_apps_test/ && pytest \
            -vv -ra -s \
            -m device_test \
            --model-selection "${{ inputs.model_selection }}" \
            --test-stage "${{ inputs.test_stage }}" \
            --qdc-token "$QDC_TOKEN" \
            --json-report --json-report-file="${{ inputs.app }}-results.json" \
            -k "${{ inputs.app }}"

      - name: Ensure json-report-file
        if: always()
        run: |
          RESULTS_FILE="tools/python/qai_hub_apps_test/${{ inputs.app }}-results.json"
          if [ ! -f "$RESULTS_FILE" ]; then
            echo '{"tests":[
              {"nodeid":"test_1_fetch_app[${{ inputs.app }}-setup_failed]","outcome":"failed"},
              {"nodeid":"test_2_build_app[${{ inputs.app }}-setup_failed]","outcome":"failed"},
              {"nodeid":"test_3_on_device_app[${{ inputs.app }}-setup_failed]","outcome":"failed"}
            ]}' > "$RESULTS_FILE"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.app }}
          path: tools/python/qai_hub_apps_test/${{ inputs.app }}-results.json
