name: Release - Wheel
run-name: Release - Wheel (${{ inputs.target }})


env:
  PYTHON_VERSION: '3.10'
  PYTHONUNBUFFERED: 1
  VENV_PATH: qaiha-dev
  CLI_EGG_INFO_DIR: "cli/qai_hub_apps.egg-info"

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
      inputs:
          target:
              required: true
              type: choice
              default: dev
              description: Release Target
              options:
              - dev
              - staging
              - prod
  workflow_call:
      inputs:
          target:
              required: true
              type: string
          skip_approval:
            required: false
            type: boolean
            default: false
          expected_version:
            # If set, fail unless the resolved version matches. A guard against
            # unexpected release behaviours
            required: false
            type: string
            default: ''
      outputs:
          version:
              description: "The released version"
              value: ${{ jobs.release_apps_and_wheel.outputs.version }}
          sha:
              description: "Short commit SHA the release was built from"
              value: ${{ jobs.release_apps_and_wheel.outputs.sha }}

jobs:
  approve:
    if: ${{ !inputs.skip_approval && (inputs.target == 'prod' || inputs.target == 'dev') }}
    name: Approve Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - run: echo "Release approved"

  release_apps_and_wheel:
      name: Release Apps and Wheel (${{ inputs.target }})
      needs: [approve]
      if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
      runs-on: [tetra-ubuntu-2204, self-hosted]
      permissions:
        id-token: write
        contents: read
      outputs:
        version: ${{ steps.version.outputs.version }}
        sha: ${{ steps.version.outputs.sha }}
      steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup AWS Credentials
        uses: ./.github/actions/configure-multiple-aws-roles
        with:
          role-to-assume: ${{ secrets.QAIHA_CI_AWS_ROLE_ARN }}
          role-duration-seconds: 7200
          profile: qaihm
          aws-region: us-west-2

      - name: Install Deps
        env:
            SUDO_PASSWORD: ${{ secrets.TETRASERVICE_PASSWORD }}
        run: |
            bash tools/setup_env.sh --python="${{ steps.setup_python.outputs.python-path }}" --venv="${{ env.VENV_PATH }}"

      - name: Resolve version
        id: version
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          python tools/ci/resolve_version.py \
            --target "${{ inputs.target }}" \
            --expected "${{ inputs.expected_version }}" >> "$GITHUB_OUTPUT"

      - name: Build and upload app bundles to S3, generate registry.yaml
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          # Dev publishes the test app set with --force (dev version + dev S3 prefix);
          # pypi targets publish the default production set.
          EXTRA=""
          if [ "${{ inputs.target }}" == "dev" ]; then
            EXTRA="--force --scope test"
          fi
          python -m qai_hub_apps_test.scripts.generate_registry \
            --output_dir cli/qai_hub_apps/ --build_and_upload --ref ${{ github.ref_name }} \
            --cli_version "${{ steps.version.outputs.version }}" $EXTRA

      - name: Build wheel
        id: wheel
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          # The working tree is dirty after registry generation, so pin the version explicitly.
          WHEEL="$(SETUPTOOLS_SCM_PRETEND_VERSION="${{ steps.version.outputs.version }}" \
            python tools/ci/build_cli_wheel.py cli/build/wheel)"
          echo "path=$WHEEL" >> "$GITHUB_OUTPUT"

      - name: Upload wheel to S3 + regenerate index
        # run always except when staging
        if: ${{ inputs.target != 'staging' }}
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          python -m qai_hub_apps_test.scripts.publish_wheel_s3 \
            --wheel_path "${{ steps.wheel.outputs.path }}" \
            --cli_version "${{ steps.version.outputs.version }}"

      - name: Upload to PyPI
        if: ${{ inputs.target != 'dev' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ inputs.target == 'prod' && secrets.PYPI_TOKEN || secrets.TEST_PYPI_TOKEN }}
          TWINE_REPOSITORY_URL: ${{ inputs.target == 'prod' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
        run: |
          source ${{ env.VENV_PATH }}/bin/activate
          pip install twine
          twine upload --verbose "${{ steps.wheel.outputs.path }}"
