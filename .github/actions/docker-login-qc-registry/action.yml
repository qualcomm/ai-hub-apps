name: Docker login - Qualcomm internal registry

description: Authenticates with the Qualcomm internal Docker registry (docker-registry.qualcomm.com)

inputs:
  token:
    description: Application token for docker-registry.qualcomm.com (use secrets.DOCKER_QC_REGISTRY_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Log in to Qualcomm Docker registry (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        DOCKER_QC_REGISTRY_TOKEN: ${{ inputs.token }}
      run: echo "$DOCKER_QC_REGISTRY_TOKEN" | docker login -u='$app' --password-stdin docker-registry.qualcomm.com

    - name: Log in to Qualcomm Docker registry (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      env:
        DOCKER_QC_REGISTRY_TOKEN: ${{ inputs.token }}
      run: $env:DOCKER_QC_REGISTRY_TOKEN | docker login -u '$app' --password-stdin docker-registry.qualcomm.com
