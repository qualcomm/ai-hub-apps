[build-system]
requires = ["setuptools >= 80", "setuptools-scm>=9,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "qai-hub-apps"
authors = [
    {name = "Qualcomm® Technologies, Inc", email = "ai_hub_support@qti.qualcomm.com"},
]
description = "CLI for browsing and downloading Qualcomm® AI Hub Apps."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
classifiers = [
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = [
    "qai-hub-models-cli==0.66.0",
    "packaging>=24.2",
    "platformdirs>=3.0",
    "prettytable>=3.10,<=3.16.0",
    "pydantic>=2.0",
    "pyyaml",
]

[project.scripts]
qai-hub-apps = "qai_hub_apps.main:main"

[project.urls]
Homepage = "https://aihub.qualcomm.com/apps"
GitHub = "https://github.com/qualcomm/ai-hub-apps"

[tool.setuptools.packages.find]
include = ["qai_hub_apps*"]
# Internal test/build tooling.
exclude = ["qai_hub_apps._internal*"]

[tool.setuptools.exclude-package-data]
"qai_hub_apps" = ["registry.yaml"]
"*" = ["_internal/*", "_internal/**/*"]

[tool.setuptools_scm]
root = ".."
version_file = "qai_hub_apps/_version.py"

[project.optional-dependencies]
# The Qualcomm Device Cloud SDK is installed out-of-band; see
# tools/setup_env.sh --with-qdc-sdk.
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "pytest-json-report",
    "setuptools-scm>=9,<10",
    "pydantic-yaml==1.4.0",
    "ruamel.yaml==0.18.10",
    "jinja2<=3.1.6",
    "typed-argument-parser",
    "tenacity==9.1.4",
    "tqdm>=4.66",                        # for fetching test assets
    "boto3>=1.26,<=1.40.0",              # for fetching test assets
    "botocore>=1.26,<=1.40.0",
    "boto3-stubs[s3,sts]>=1.26,<=1.40.0",
    "pre-commit",
    "mypy",
]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["qai_hub_apps"]
addopts = "--cov=qai_hub_apps --cov-report=term-missing --cov-fail-under=100 -m 'not integration' --ignore=qai_hub_apps/_internal"

[tool.coverage.report]
omit = ["*_test.py", "*conftest.py", "qai_hub_apps/_internal/*"]
# A file with a `# pragma: exclude file` comment is skipped entirely.
exclude_also = ["\\A(?s:.*# pragma: exclude file.*)\\Z"]

[tool.pydoclint]
style = 'numpy'
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = true
skip-checking-raises = true
allow-init-docstring = true
check-style-mismatch = true

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "qai_hub_apps.*"
disable_error_code = ["type-abstract", "override", "method-assign"]
check_untyped_defs = true
