schema_version: '1.1'
min_cli_version: 0.29.0
apps:
- name: LLM Chat Android
  id: chatapp_android
  status: deprecated
  headline: Run an LLM on Android
  description: A sample Android chat app showcasing how to integrate an on-device LLM with Qualcomm® Gen AI Inference Extensions (Genie) APIs, optimized for Snapdragon® NPU acceleration.
  domain: Generative AI
  use_case: Text Generation
  app_repo_url: https://github.com/qualcomm/ai-hub-apps/tree/main/apps/chatapp_android
  app_type: android
  runtime: genie
  related_models:
  - qwen3_4b_instruct_2507
  - llama_v3_2_3b_instruct
  precisions:
  - w4a16
  model_file_dir: src/main/assets/models/llm
  deprecation_notice: LLM Chat Android is deprecated in favour of the GenieX Demo app (geniex_chat_android), which runs LLMs and VLMs on-device via the Qualcomm® GenieX SDK.
- name: LLM Chat Windows
  id: chatapp_windows_cpp
  status: published
  headline: Deploy and run LLMs via CLI
  description: A sample CLI app demonstrating how to integrate an on-device LLM with Qualcomm® Gen AI Inference Extensions (Genie) APIs, optimized for Snapdragon® NPU acceleration.
  domain: Generative AI
  use_case: Text Generation
  app_repo_url: https://github.com/qualcomm/ai-hub-apps/tree/main/apps/chatapp_windows_cpp
  app_type: windows
  runtime: genie
  related_models:
  - qwen3_4b_instruct_2507
  - llama_v3_8b_instruct
  - llama_v3_1_8b_instruct
  - llama_v3_2_3b_instruct
  - llama_v3_taide_8b_chat
  precisions:
  - w4a16
  model_file_dir: genie_bundle
- name: Image Classification Android
  id: image_classification_android
  status: published
  headline: On-device image recognition with TFLite
  description: A sample app that classifies images and displays the top three predicted ImageNet classes, demonstrating the best practices for TFLite model inference on Android devices.
  domain: Computer Vision
  use_case: Image Classification
  app_repo_url: https://github.com/qualcomm/ai-hub-apps/tree/main/apps/image_classification_android
  app_type: android
  runtime: tflite
  related_models:
  - convnext_tiny
  - densenet121
  - efficientnet_b0
  - googlenet
  - inception_v3
  - mnasnet05
  - mobilenet_v2
  - mobilenet_v3_large
  - mobilenet_v3_small
  - regnet
  - resnet101
  - resnet18
  - resnet50
  - resnext101
  - resnext50
  - shufflenet_v2
  - squeezenet1_1
  - vit
  - wideresnet50
  precisions:
  - float
  model_file_paths:
  - src/main/assets/classifier.tflite
