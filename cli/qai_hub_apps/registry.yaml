- name: MediaPipe Hand Gesture Recognition
  id: mediapipe_hand_gesture_ubuntu_py
  status: published
  headline: On-device hand gesture recognition with TFLite
  description: A sample app for Ubuntu integrating the MediaPipe Hand Gesture recognition model via TFLite Runtime. It leverages GStreamer for input video and provides a minimal web interface to stream output frames suitable for embedded applications.
  domain: Computer Vision
  use_case: Object Detection
  app_repo_url: https://github.com/qualcomm/ai-hub-apps/tree/main/apps/mediapipe_hand_gesture_ubuntu_py
  app_type: ubuntu
  runtime: tflite
  related_models:
  - mediapipe_hand_gesture
  precisions:
  - w8a8
  model_file_paths:
  - models/palm_detector.tflite
  - models/hand_landmark_detector.tflite
  - models/canned_gesture_classifier.tflite
- name: Semantic Segmentation Android
  id: semantic_segmentation_android
  status: published
  headline: Learn real-time image processing with TFLite and OpenCV
  description: A sample Android app demonstrating semantic segmentation on live camera input, showcasing the integration of streaming camera, TFLite, and OpenCV. It provides a practical example of AI-powered image analysis in real time.
  domain: Computer Vision
  use_case: Semantic Segmentation
  app_repo_url: https://github.com/qualcomm/ai-hub-apps/tree/main/apps/semantic_segmentation_android
  app_type: android
  runtime: tflite
  related_models:
  - ffnet_40s
  - ffnet_54s
  - ffnet_78s
  - ffnet_78s_lowres
  - ffnet_122ns_lowres
  precisions:
  - float
  model_file_paths:
  - src/main/assets/segmenter.tflite
- name: Stable Diffusion Windows
  id: stable_diffusion_windows_py
  status: published
  headline: Text-to-image generation on Snapdragon® NPUs
  description: A sample CLI Windows app for image generation from text descriptions using Stable Diffusion. It leverages the ONNX execution provider to optimize processing on the Snapdragon® Neural Processing Unit (NPU), making it an excellent learning tool for AI-driven creative applications on Windows.
  domain: Generative AI
  use_case: Image Generation
  app_repo_url: https://github.com/qualcomm/ai-hub-apps/tree/main/apps/stable_diffusion_windows_py
  app_type: windows
  runtime: precompiled_qnn_onnx
  related_models:
  - stable_diffusion_v2_1
  precisions:
  - w8a16
  model_file_paths:
  - model/text_encoder.onnx
  - model/unet.onnx
  - model/vae.onnx
